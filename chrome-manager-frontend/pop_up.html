<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chrome Agent</title>
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
        input[type="password"] { width: 100%; padding: 6px; margin-bottom: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-bottom: 8px; background: #4285f4; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: default; }
        #status { margin-top: 10px; font-size: 12px; color: #666; }
        details { margin-bottom: 10px; font-size: 12px; }
        summary { cursor: pointer; color: #4285f4; }
    </style>
</head>
<body>
    <h3>Chrome Agent</h3>

    <details id="apiKeySection">
        <summary>Groq API Key</summary>
        <input type="password" id="apiKeyInput" placeholder="Paste your Groq API key here" />
        <button id="saveKeyBtn">Save Key</button>
    </details>

    <textarea id="userInput" placeholder="e.g., Group all GitHub tabs..."></textarea>
    <button id="sendBtn">Run Command</button>
    <button id="checkBtn">Check Connection</button>
    <div id="status"></div>
    <script src="pop_up.js"></script>
</body>
</html>
