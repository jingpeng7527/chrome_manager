<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chrome Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Shown in Chrome's side panel: tall, narrow and resizable. The page
           fills the panel's height, keeps the composer pinned to the bottom
           and lets the middle scroll. Plain CSS only, nothing to fetch.
           Icons are inline SVG rather than Unicode symbols: symbols such as
           ▦ or ⧉ are missing from the UI font, and the font fallback search
           added ~4 ms to every open in a headless timing run. */
        :root {
            color-scheme: dark;
            --bg: #18181a;
            --surface: #222225;
            --surface-2: #2a2a2e;
            --border: #303035;
            --border-strong: #3d3d44;
            --text: #ececef;
            --text-2: #a4a4ad;
            --text-3: #6e6e78;
            --accent: #5b93f8;
            --accent-hover: #4a84ee;
            --accent-soft: rgba(91, 147, 248, 0.14);
            --ok: #5fc27a;
            --ok-bg: rgba(95, 194, 122, 0.10);
            --err: #ef6b6b;
            --err-bg: rgba(239, 107, 107, 0.10);
            --radius: 12px;
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #f7f7f8;
                --surface: #ffffff;
                --surface-2: #f0f0f2;
                --border: #e3e3e7;
                --border-strong: #cfcfd6;
                --text: #1b1b1f;
                --text-2: #55555e;
                --text-3: #8a8a94;
                --accent: #2f6fe4;
                --accent-hover: #255fcc;
                --accent-soft: rgba(47, 111, 228, 0.10);
                --ok: #1f8a43;
                --ok-bg: rgba(31, 138, 67, 0.09);
                --err: #c93c3c;
                --err-bg: rgba(201, 60, 60, 0.08);
            }
        }

        html, body { height: 100%; }
        html { background: var(--bg); }
        body {
            min-width: 280px;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.45;
        }

        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6aa1ff, #3f73e6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .logo svg { width: 15px; height: 15px; }

        .title-block { min-width: 0; flex: 1; }
        .title { font-weight: 600; font-size: 14px; line-height: 1.2; }
        .subtitle { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .open-time:not(:empty)::before { content: '·'; margin: 0 6px; }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: none;
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: var(--surface-2); color: var(--text); }
        .icon-btn svg { width: 17px; height: 17px; }

        /* Scrolling middle */
        .main {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 22px 16px 16px;
        }

        .intro h1 { font-size: 17px; font-weight: 600; line-height: 1.3; }
        .intro p { margin-top: 4px; color: var(--text-2); }

        .section-label {
            margin: 22px 0 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .examples {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 8px;
        }

        .example-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .example-chip:hover { border-color: var(--accent); background: var(--surface-2); }

        .chip-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chip-icon svg { width: 16px; height: 16px; }
        .chip-text { min-width: 0; display: flex; flex-direction: column; }
        .chip-title { font-weight: 500; }
        .chip-desc { font-size: 11.5px; color: var(--text-3); }

        /* Composer, pinned to the bottom */
        .composer {
            flex-shrink: 0;
            padding: 12px 16px 10px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .status-bar {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px 11px;
            border-radius: 10px;
            font-size: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            overflow-wrap: anywhere;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .status-bar.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
        .status-bar.error { background: var(--err-bg); border-color: transparent; color: var(--err); }
        .status-bar.loading { color: var(--text); }
        .status-bar.loading .status-dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }

        .status-dot {
            width: 7px;
            height: 7px;
            margin-top: 5px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        @keyframes pulse { 50% { opacity: 0.3; } }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 8px 8px 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        textarea {
            flex: 1;
            min-width: 0;
            min-height: 40px;
            max-height: 40vh;
            padding: 3px 0;
            background: none;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font: inherit;
            font-size: 13.5px;
            line-height: 1.45;
        }
        textarea::placeholder { color: var(--text-3); }
        textarea:focus-visible { outline: none; }

        .send-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 9px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, opacity 0.15s;
        }
        .send-btn svg { width: 16px; height: 16px; }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.4; cursor: default; }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-3);
        }
        .hint kbd { font-family: inherit; color: var(--text-2); }

        .check-btn {
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: transparent;
            text-underline-offset: 2px;
            transition: color 0.15s, text-decoration-color 0.15s;
        }
        .check-btn:hover { color: var(--text); text-decoration-color: currentColor; }
        .check-btn:disabled { opacity: 0.5; cursor: default; }

        @media (max-width: 299px) { .hint { display: none; } .footer { justify-content: flex-end; } }

        /* API key modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            width: 100%;
            max-width: 340px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }
        .modal h4 { font-size: 14px; font-weight: 600; }
        .modal p { margin: 4px 0 12px; font-size: 12px; color: var(--text-2); }

        .modal input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-family: ui-monospace, Menlo, monospace;
            font-size: 12px;
            padding: 9px 10px;
            outline: none;
            margin-bottom: 12px;
        }
        .modal input:focus { border-color: var(--accent); }

        .modal-btns { display: flex; gap: 8px; }
        .modal-btns button {
            flex: 1;
            border-radius: 8px;
            font-size: 12.5px;
            padding: 8px;
            cursor: pointer;
        }
        .modal-save { background: var(--accent); border: none; color: #fff !important; }
        .modal-save:hover { background: var(--accent-hover); }
        .modal-cancel { background: none; border: 1px solid var(--border-strong); color: var(--text-2) !important; }
        .modal-cancel:hover { background: var(--surface-2); }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/></svg></div>
        <div class="title-block">
            <div class="title">Tab Agent</div>
            <div class="subtitle"><span id="tabCount">— tabs</span><span class="open-time" id="openTime"></span></div>
        </div>
        <button class="icon-btn" id="openKeyModal" title="Groq API key" aria-label="Groq API key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg>
        </button>
    </header>

    <main class="main">
        <div class="intro">
            <h1>What should I do with your tabs?</h1>
            <p>Describe it in plain words, or start from one of these.</p>
        </div>

        <div class="section-label">Try</div>
        <div class="examples">
            <button class="example-chip" data-prompt="Group by topic">
                <span class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
                <span class="chip-text"><span class="chip-title">Group by topic</span><span class="chip-desc">Sort tabs into groups by subject</span></span>
            </button>
            <button class="example-chip" data-prompt="Close duplicates">
                <span class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></span>
                <span class="chip-text"><span class="chip-title">Close duplicates</span><span class="chip-desc">Keep one copy of each page</span></span>
            </button>
            <button class="example-chip" data-prompt="Group GitHub tabs">
                <span class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg></span>
                <span class="chip-text"><span class="chip-title">Group GitHub tabs</span><span class="chip-desc">Collect every github.com tab</span></span>
            </button>
            <button class="example-chip" data-prompt="Ungroup all">
                <span class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg></span>
                <span class="chip-text"><span class="chip-title">Ungroup all</span><span class="chip-desc">Remove every tab group</span></span>
            </button>
        </div>
    </main>

    <div class="composer">
        <div class="status-bar" id="statusBar" role="status">
            <div class="status-dot"></div>
            <span id="statusText">Ready</span>
        </div>

        <div class="input-box">
            <textarea id="userInput" rows="2" placeholder="Tell me what to do with your tabs…"></textarea>
            <button class="send-btn" id="sendBtn" title="Send (Enter)" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
        </div>

        <div class="footer">
            <span class="hint"><kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
            <button class="check-btn" id="checkBtn">Check connection</button>
        </div>
    </div>

    <!-- API Key modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-labelledby="modalTitle">
            <h4 id="modalTitle">Groq API key</h4>
            <p>Saved in this browser only. Pasting a key saves it right away.</p>
            <input type="password" id="apiKeyInput" placeholder="gsk_…" />
            <div class="modal-btns">
                <button class="modal-cancel" id="modalCancel">Cancel</button>
                <button class="modal-save" id="saveKeyBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="pop_up.js"></script>
</body>
</html>
