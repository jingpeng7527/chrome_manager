name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the project has no dependencies and the test runner
      # is built into Node.
      - name: Check extension scripts parse
        run: npm run check

      - name: Run tests
        run: npm test
